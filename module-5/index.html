    <!-- RIGHT: Summary -->
    <div class="col-12 col-lg-5 summary">
        <div class="px-2">
            <div class="border-top pt-2 mb-3" style="opacity:.7;"></div>
            <h5 class="fw-bold mb-3">Order Summary</h5>

            <div class="d-flex justify-content-between py-2">
                <div>Subtotal</div>
                <div class="fw-semibold">$<span id="subtotalVal">252</span></div>
            </div>

            <div class="d-flex justify-content-between py-2">
                <div>Discount</div>
                <div class="fw-semibold">$<span id="discountVal">0</span></div>
            </div>

            <div class="border-top my-2" style="opacity:.25;"></div>

            <div class="d-flex justify-content-between align-items-center py-2 summary-title">
                <div>Total</div>
                <div class="fs-5 fw-bold">$<span id="totalVal">252</span></div>
            </div>

            <div class="promo-wrap mt-3">
                <input id="promoInput" class="form-control" type="text" placeholder="Add promo code">
                <button class="btn-apply" type="button" id="applyPromo">Apply</button>
            </div>

            <button class="btn-dark-wide mt-3" type="button">Go To Checkout</button>

            <div class="mt-4 text-muted small" style="max-width: 380px;">
                <p class="mb-3">Prices and costs are not displayed until you complete your purchase.</p>
                <p class="mb-3">
                    You have 30 days to change your mind. Read more about
                    <a href="#" class="text-muted">Delivery and Return</a>.
                </p>
                <p class="mb-0">
                    Need help? Please contact <a href="#" class="text-muted">Customer Support</a>.

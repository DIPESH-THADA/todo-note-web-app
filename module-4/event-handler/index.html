<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="login-form">
        <div class="mb-4"> <label class="form-label fw-semibold">Email</label> <input type="email" id="username"
                name="email" class="form-control" placeholder=""> </div>
        <div class="mb-3"> <label class="form-label fw-semibold">Password</label> <input type="password" id="password"
                name="password" class="form-control" placeholder=""> </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check"> <input class="form-check-input" type="checkbox" id="remember"> <label
                    class="form-check-label" for="remember">Remember me</label> </div> <a class="muted-link"
                href="#">Forgot password?</a>
        </div><button type="submit" class="btn btn-dark-wide text-white">LOGIN</button>
        <div class="text-center mt-3"> <span class="text-muted">Or </span> <a
                class="text-dark text-decoration-underline" href="#">Create an Account</a>
        </div>

        <button id="the-button" class="btn">The Button</button>
    </form>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
